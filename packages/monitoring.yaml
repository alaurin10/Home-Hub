# Health monitoring — stale sensors, low battery, disk, UPS. See §12.
# Template sensors here; the alerting automations live in automations.yaml (or
# graduate into a package) so we keep a single `automation:` source.

template:
  - binary_sensor:
      # Fires if the office air node hasn't reported in >10 minutes.
      - name: "Office Air Stale"
        unique_id: office_air_stale
        device_class: problem
        state: >
          {% set s = states.sensor.office_air_co2 %}
          {{ s is none or (now() - s.last_updated).total_seconds() > 600 }}


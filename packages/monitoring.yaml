# Health monitoring — stale sensors, low battery, disk, UPS. See §12.
# Template sensors here; the alerting automations live in automations.yaml (or
# graduate into a package) so we keep a single `automation:` source.
#
# Fleet-scalable pattern: ONE list of air-node locations drives both sensors
# below. Adding a node = adding its location to `nodes` in each template.
# Every node also exposes binary_sensor.<location>_air_status (ESPHome status
# platform via esphome/common/base.yaml) — used for API-connectivity checks.

template:
  - sensor:
      # Comma-separated list of air nodes whose CO2 reading is >10 min old
      # (or missing entirely). Empty string = whole fleet fresh.
      # `now()` makes HA re-evaluate this template every minute.
      - name: "Stale Air Nodes"
        unique_id: stale_air_nodes
        icon: mdi:wifi-strength-alert-outline
        state: >
          {% set nodes = ['office', 'kitchen', 'bedroom', 'living'] %}
          {% set ns = namespace(stale=[]) %}
          {% for n in nodes %}
            {% set s = states.sensor[n ~ '_air_co2'] %}
            {% if s is none or (now() - s.last_updated).total_seconds() > 600 %}
              {% set ns.stale = ns.stale + [n] %}
            {% endif %}
          {% endfor %}
          {{ ns.stale | join(', ') }}

  - binary_sensor:
      # On when ANY air node is stale (above) or its ESPHome API is
      # disconnected (status sensor off). Single entity to alert on.
      - name: "Air Fleet Problem"
        unique_id: air_fleet_problem
        device_class: problem
        state: >
          {% set nodes = ['office', 'kitchen', 'bedroom', 'living'] %}
          {% set stale = states('sensor.stale_air_nodes') not in ['', 'unknown', 'unavailable'] %}
          {% set ns = namespace(disconnected=false) %}
          {% for n in nodes %}
            {% if is_state('binary_sensor.' ~ n ~ '_air_status', 'off') %}
              {% set ns.disconnected = true %}
            {% endif %}
          {% endfor %}
          {{ stale or ns.disconnected }}


          {% set rh = [states('sensor.bedroom_air_humidity') | float(50), 1] | max %}
          {% set g = log(rh / 100) + (17.62 * t) / (243.12 + t) %}
          {% set dew_c = 243.12 * g / (17.62 - g) %}
          {{ (dew_c * 9 / 5 + 32) | round(1) }}

      - name: "Bedroom Air Absolute Humidity"
        unique_id: bedroom_air_absolute_humidity
        unit_of_measurement: "g/m³"
        icon: mdi:water-percent
        state_class: measurement
        availability: >
          {{ has_value('sensor.bedroom_air_temperature')
             and has_value('sensor.bedroom_air_humidity') }}
        state: >
          {% set t_f = states('sensor.bedroom_air_temperature') | float(68) %}
          {% set t = (t_f - 32) * 5 / 9 %}
          {% set rh = states('sensor.bedroom_air_humidity') | float(50) %}

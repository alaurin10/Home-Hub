# Derived comfort metrics — zero hardware, computed from the air nodes'
# existing temperature + humidity. Dew point (Magnus formula) and absolute
# humidity (g/m³) are far more actionable than raw RH% — e.g. dew point >61°F
# feels muggy; absolute humidity shows whether opening a window will actually
# dry the room. Per-room entities follow the locked naming convention
# (sensor.<location>_air_<measurement>, docs/01-naming-conventions.md).
#
# The air nodes report temperature in °F (HA's configured unit system) but
# the Magnus formula's constants only work in Celsius, so every template
# below converts °F -> °C first, does the math, then (for dew point, itself
# a temperature) converts the result back to °F. Absolute humidity has no
# common imperial equivalent, so it stays g/m³ regardless.
#
# Deliberately NOT added to the HomeKit allowlist (packages/homekit.yaml) —
# they are derived from data already exposed. Add them there if you want them
# surfaced as Apple Home tiles too.

template:
  - sensor:
      # ------------------------------ Kitchen -------------------------------
      - name: "Kitchen Air Dew Point"
        unique_id: kitchen_air_dew_point
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ has_value('sensor.kitchen_air_temperature')
             and has_value('sensor.kitchen_air_humidity') }}
        state: >
          {% set t_f = states('sensor.kitchen_air_temperature') | float(68) %}
          {% set t = (t_f - 32) * 5 / 9 %}
          {% set rh = [states('sensor.kitchen_air_humidity') | float(50), 1] | max %}
          {% set g = log(rh / 100) + (17.62 * t) / (243.12 + t) %}
          {% set dew_c = 243.12 * g / (17.62 - g) %}
          {{ (dew_c * 9 / 5 + 32) | round(1) }}

      - name: "Kitchen Air Absolute Humidity"
        unique_id: kitchen_air_absolute_humidity
        unit_of_measurement: "g/m³"
        icon: mdi:water-percent
        state_class: measurement
        availability: >
          {{ has_value('sensor.kitchen_air_temperature')
             and has_value('sensor.kitchen_air_humidity') }}
        state: >
          {% set t_f = states('sensor.kitchen_air_temperature') | float(68) %}
          {% set t = (t_f - 32) * 5 / 9 %}
          {% set rh = states('sensor.kitchen_air_humidity') | float(50) %}
          {% set svp = 6.112 * e ** ((17.62 * t) / (243.12 + t)) %}
          {{ (216.7 * (rh / 100 * svp) / (273.15 + t)) | round(1) }}


# InfluxDB 2.x forwarding — CURATED ALLOWLIST ONLY. Never forward everything or
# the bucket bloats. Recorder exclusions are independent of this. See §8.
influxdb:
  api_version: 2
  host: a0d7b954-influxdb     # InfluxDB add-on hostname (adjust in Phase 4)
  port: 8086
  ssl: false
  verify_ssl: false
  token: !secret influxdb_token
  organization: home          # your Influx org
  bucket: home_assistant      # your Influx bucket
  measurement_attr: entity_id
  tags_attributes:
    - friendly_name
  include:
    entities:
      - sensor.office_air_co2
      - sensor.office_air_temperature
      - sensor.office_air_humidity

# MIRROR of /addon_configs/<z2m-slug>/configuration.yaml (authored parts only).
# Generated state (coordinator_backup.json, database.db, the network key) is
# BACKUP-ONLY and never committed. Deployed via pull → restart Z2M (Phase 5).
# See docs/00-architecture.md §5 and §11.

homeassistant: true
permit_join: false

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://core-mosquitto:1883
  user: zigbee2mqtt
  password: "!secret mqtt_password" # Z2M uses its OWN secret.yaml in the add-on

serial:
  # Pass the ZBT-2 through by-id (NOT by port). Fill in after Phase 5.
  port: /dev/serial/by-id/CHANGE_ME-ZBT-2
  adapter: ember

advanced:
  # Pick a Zigbee channel clear of your WiFi (open item; decide before mass pairing).
  channel: 20
  # network_key is generated by Z2M on first run and becomes BACKUP-ONLY state.
  network_key: GENERATE

frontend:
  port: 8099

# Devices get friendly_names per the scheme at PAIRING TIME (never leave 0x00124b…):
# devices:
#   '0x00124b00xxxxxxxx':
#     friendly_name: living_light_ceiling

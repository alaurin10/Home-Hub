# Lovelace dashboard (YAML mode) — registered in configuration.yaml under
# lovelace: dashboards: home-overview. Edit here (git), not in the UI.
title: Home Overview
views:
  - title: Overview
    path: overview
    cards:
      - type: entities
        title: Kitchen Air
        entities:
          - entity: sensor.kitchen_air_co2
          - entity: sensor.kitchen_air_temperature
          - entity: sensor.kitchen_air_humidity
      - type: history-graph
        title: CO2 (last 24h)
        hours_to_show: 24
        entities:
          - entity: sensor.kitchen_air_co2
          - entity: sensor.bedroom_air_co2
          - entity: sensor.living_air_co2

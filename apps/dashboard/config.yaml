# Home-Hub Dashboard — app configuration (the v1 "customizable" surface).
# Rooms, their HA entities, and air-quality thresholds all live here:
# add a room or tweak a band and the UI follows — no source edits.
# Entity naming per docs/01-naming-conventions.md.

house_name: Home

rooms:
  - id: kitchen
    name: Kitchen
    entities:
      co2: sensor.kitchen_air_co2
      temperature: sensor.kitchen_air_temperature
      humidity: sensor.kitchen_air_humidity
      dew_point: sensor.kitchen_air_dew_point
      absolute_humidity: sensor.kitchen_air_absolute_humidity
      voc: sensor.kitchen_air_voc
      nox: sensor.kitchen_air_nox
      pm1_0: sensor.kitchen_air_pm1_0
      pm2_5: sensor.kitchen_air_pm2_5
      pm10: sensor.kitchen_air_pm10
    node:
      status: binary_sensor.kitchen_air_status
      wifi_signal: sensor.kitchen_air_wifi_signal
      uptime: sensor.kitchen_air_uptime
      esphome_version: sensor.kitchen_air_esphome_version
      ip_address: sensor.kitchen_air_ip_address

  - id: bedroom
    name: Bedroom
    entities:
      co2: sensor.bedroom_air_co2
      temperature: sensor.bedroom_air_temperature
      humidity: sensor.bedroom_air_humidity
      dew_point: sensor.bedroom_air_dew_point
      absolute_humidity: sensor.bedroom_air_absolute_humidity
    node:
      status: binary_sensor.bedroom_air_status
      wifi_signal: sensor.bedroom_air_wifi_signal
      uptime: sensor.bedroom_air_uptime
      esphome_version: sensor.bedroom_air_esphome_version
      ip_address: sensor.bedroom_air_ip_address

  - id: living
    name: Living Room
    entities:
      co2: sensor.living_air_co2
      temperature: sensor.living_air_temperature
      humidity: sensor.living_air_humidity
      dew_point: sensor.living_air_dew_point
      absolute_humidity: sensor.living_air_absolute_humidity
    node:
      status: binary_sensor.living_air_status
      wifi_signal: sensor.living_air_wifi_signal
      uptime: sensor.living_air_uptime
      esphome_version: sensor.living_air_esphome_version
      ip_address: sensor.living_air_ip_address

# Fleet-health entities (packages/monitoring.yaml)
fleet:
  stale_nodes: sensor.stale_air_nodes
  problem: binary_sensor.air_fleet_problem

# Status bands per metric. Two shapes:
#   bounds: [a, b, c]  — monotonic: value < a = good, then fair/poor/bad.
#   ranges: {good/fair/poor: [lo, hi]} — band: too low AND too high are both
#     bad; windows must nest (good within fair within poor), outside poor = bad.
# Units are display-only. These drive every signal color in the UI.
thresholds:
  temperature: {ranges: {good: [67, 75], fair: [64, 78], poor: [60, 82]}, unit: "°F"}
  humidity: {ranges: {good: [35, 55], fair: [30, 60], poor: [25, 65]}, unit: "%"}
  co2: {bounds: [800, 1200, 2000], unit: ppm}
  pm2_5: {bounds: [12, 35, 55], unit: "µg/m³"}
  pm1_0: {bounds: [12, 35, 55], unit: "µg/m³"}
  pm10: {bounds: [45, 100, 150], unit: "µg/m³"}
  voc: {bounds: [150, 250, 400], unit: ""}
  nox: {bounds: [20, 150, 300], unit: ""}

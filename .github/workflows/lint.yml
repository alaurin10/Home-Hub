name: lint

# Hygiene gate: YAML lint (style/syntax beyond what HA/ESPHome schema checks
# catch) + gitleaks secret scanning over the full history. The .gitignore
# keeps secrets.yaml out of git; gitleaks catches the other failure mode —
# a token pasted into a TRACKED file. See docs/08-audit-2026-06.md.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint
        run: yamllint .

  # The "revisit with a CI drift check" from audit finding 2
  # (docs/08-audit-2026-06.md): fail when configs reference entities nothing
  # defines.
  entity-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: entity drift check
        run: python3 scripts/check-entity-drift.py

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action needs this to list PR commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so leaks in old commits are found

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: ha-check

# Cloud validation gate for Home Assistant config. Validates schema with
# check_config; does not connect to anything. See docs/00-architecture.md §13.

on:
  pull_request:
    paths:
      - "configuration.yaml"
      - "packages/**"
      - "automations.yaml"
      - "scripts.yaml"
      - "scenes.yaml"
      - "dashboards/**"
      - "secrets.yaml.example"
      - ".ha-version"
  push:
    branches: [main]
    paths:
      - "configuration.yaml"
      - "packages/**"
      - "automations.yaml"
      - "scripts.yaml"
      - "scenes.yaml"
      - "dashboards/**"
      - "secrets.yaml.example"
      - ".ha-version"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provide dummy secrets
        run: cp secrets.yaml.example secrets.yaml

      - name: Home Assistant check_config
        # Pinned via the .ha-version file (single source of truth). Update it
        # when you upgrade HA: Settings → System → About → note the version →
        # edit .ha-version. Format: YYYY.M (no leading zero on month), e.g.
        # 2026.5, 2026.6, 2026.12. Available tags:
        # https://github.com/home-assistant/core/pkgs/container/home-assistant
        run: |
          HA_VERSION="$(cat .ha-version)"
          docker run --rm -v "${PWD}:/config" \
            "ghcr.io/home-assistant/home-assistant:${HA_VERSION}" \
            python -m homeassistant --script check_config -c /config

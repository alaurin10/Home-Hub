name: ha-check

# Cloud validation gate for Home Assistant config. Validates schema with
# check_config; does not connect to anything. See docs/00-architecture.md §13.

on:
  pull_request:
    paths:
      - "configuration.yaml"
      - "packages/**"
      - "automations.yaml"
      - "scripts.yaml"
      - "scenes.yaml"
      - "dashboards/**"
      - "secrets.yaml.example"
  push:
    branches: [main]
    paths:
      - "configuration.yaml"
      - "packages/**"
      - "automations.yaml"
      - "scripts.yaml"
      - "scenes.yaml"
      - "dashboards/**"
      - "secrets.yaml.example"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provide dummy secrets
        run: cp secrets.yaml.example secrets.yaml

      - name: Home Assistant check_config
        # Pinned to HA 2026.5. Update this when you upgrade HA:
        #   Settings → System → About → note the version → change the tag below.
        # Available tags: https://github.com/home-assistant/core/pkgs/container/home-assistant
        # Format: YYYY.M (no leading zero on month), e.g. 2026.5, 2026.6, 2026.12
        run: |
          docker run --rm -v "${PWD}:/config" \
            ghcr.io/home-assistant/home-assistant:2026.5 \
            python -m homeassistant --script check_config -c /config

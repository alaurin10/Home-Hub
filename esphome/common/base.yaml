# =====================================================================
# Shared ESPHome base — inherited by EVERY node via `packages:`.
# Change WiFi / OTA / logging / diagnostics once here → all nodes inherit.
# Nodes must define substitutions `node_name` and `friendly_name`.
# See docs/00-architecture.md §4 (DRY fleet) and §7 (naming).
# =====================================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${node_name} Fallback"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO

# Encrypted native API (no broker). Key is per-fleet via secrets.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: homeassistant_time

# Diagnostics every node reports (kept out of InfluxDB; recorder-excluded).
# Entity names are short; the device-level `friendly_name` (set per node) is
# prepended by HA → e.g. "Office Air Uptime" / entity_id sensor.office_air_uptime.
sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "Status"

text_sensor:
  - platform: version
    name: "ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "IP Address"

# Reusable SCD4x air block (CO2 + temperature + humidity).
# Works for SCD40 AND SCD41 (the scd4x platform auto-detects the variant).
# Include from an air node alongside base.yaml:
#
#   packages:
#     base: !include common/base.yaml
#     air:  !include common/sensors_common.yaml
#
# Requires the node to define an `i2c:` bus (SCD4x @ 0x62). Entity names are
# short; the device `friendly_name` is prepended by HA → "Office Air CO2" /
# entity_id sensor.office_air_co2.
#
# The temperature/humidity `id:`s below are reused by sensors_air_full.yaml for
# SGP41 VOC/NOx humidity compensation on full nodes; harmless on SCD41-only nodes.
sensor:
  - platform: scd4x
    co2:
      name: "CO2"
    temperature:
      name: "Temperature"
      id: scd4x_temperature
    humidity:
      name: "Humidity"
      id: scd4x_humidity
    update_interval: 60s

# Kitchen air-quality node (FULL): SCD41 (CO2/T/RH, I²C) + SGP41 (VOC/NOx, I²C)
# + PMS7003 (PM1/2.5/10, UART). Naming per docs/01-naming-conventions.md.
substitutions:
  node_name: esp-kitchen-air
  friendly_name: Kitchen Air

packages:
  device: !include common/device_esp32.yaml
  base: !include common/base.yaml
  air: !include common/sensors_common.yaml
  aqx: !include common/sensors_air_full.yaml

# UART for the PMS7003 (9600 baud). GPIO16/17 are free on the WROOM-32
# (separate from the USB logging UART). Node-local: only the kitchen has one.
uart:
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600
